<mat-card class="header-card mat-elevation-z3">
  <div fxLayout="column" fxLayoutAlign="start start" fxLayoutGap="0.5rem">

    <p class="titulo">USUARIO: <strong>{{nombreUsuario}}</strong>.</p>
    <span class="rol">Rol: <strong>{{ rolesUsuario.join(', ') }}</strong></span>


    <p class="mensaje-bloqueo" *ngIf="mensajeBloqueo">
      <mat-icon color="warn" style="vertical-align: middle;">error_outline</mat-icon>
      {{ mensajeBloqueo }}
    </p>
  </div>
</mat-card>
