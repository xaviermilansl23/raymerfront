<div class="dialog-producto-container">
  <h2>{{ editMode ? "Editar Producto" : "Crear Producto" }}</h2>

  <form [formGroup]="productoForm" (ngSubmit)="guardarProducto()">
    <!-- Campo: Nombre -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input
        matInput
        formControlName="nombre"
        placeholder="Ingrese el nombre del producto"
      />
    </mat-form-field>

    <div class="field-row">
      <mat-form-field appearance="outline">
        <mat-label>Marca</mat-label>
        <input
          matInput
          formControlName="marca"
          maxlength="100"
          placeholder="Ej. Samsung"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Modelo</mat-label>
        <input
          matInput
          formControlName="modelo"
          maxlength="100"
          placeholder="Ej. SM-A556E"
        />
      </mat-form-field>
    </div>

    <!-- Campo: Descripción -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea
        matInput
        formControlName="descripcion"
        placeholder="Ingrese una descripción"
      ></textarea>
    </mat-form-field>

    <!-- Selector: Tipo de Producto -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo de Producto</mat-label>
      <mat-select formControlName="tipoProductoId">
        <mat-option
          *ngFor="let tipo of tiposProductos"
          [value]="tipo.tipo_producto_id"
        >
          {{ tipo.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- 🔥 NUEVO: URL Modelo 3D base -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>URL Modelo 3D (base)</mat-label>
      <input
        matInput
        formControlName="modelo3dUrl"
        placeholder="https://firebasestorage.googleapis.com/.../modelo.glb"
      />
    </mat-form-field>

    <!-- 🔥 NUEVO: URL Modelo 3D completo -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>URL Modelo 3D (completo)</mat-label>
      <input
        matInput
        formControlName="modelo3dFullUrl"
        placeholder="https://firebasestorage.googleapis.com/.../modelo-full.glb"
      />
    </mat-form-field>

    <!-- Campo: Imagen -->
    <div class="image-upload full-width">
      <button
        mat-raised-button
        color="accent"
        type="button"
        (click)="fileInput.click()"
      >
        Seleccionar Imágenes
      </button>

      <input
        type="file"
        #fileInput
        hidden
        accept="image/*"
        multiple
        (change)="onFileSelected($event)"
      />

      <div
        *ngIf="imagenesExistentes.length > 0 || imagenesPrevia.length > 0"
        class="image-preview-grid"
      >
        <!-- Imágenes ya existentes en el producto -->
        <div
          *ngFor="let img of imagenesExistentes; let i = index"
          class="image-preview-item"
        >
          <img [src]="img" alt="Imagen existente" class="image-preview" />
          <button
            mat-icon-button
            type="button"
            class="remove-img"
            (click)="eliminarExistente(i)"
            aria-label="Quitar imagen"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <!-- Previews de archivos nuevos -->
        <div
          *ngFor="let img of imagenesPrevia; let i = index"
          class="image-preview-item"
        >
          <img [src]="img" alt="Vista previa" class="image-preview" />
          <button
            mat-icon-button
            type="button"
            class="remove-img"
            (click)="eliminarNueva(i)"
            aria-label="Quitar imagen"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <br />

    <!-- Botones de acción -->
    <div class="actions">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="productoForm.invalid"
      >
        {{ editMode ? "Actualizar Producto" : "Guardar Producto" }}
      </button>
    </div>
  </form>
</div>
