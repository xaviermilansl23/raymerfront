<h2 mat-dialog-title>{{ esEdicion ? 'Editar Lote' : 'Crear Nuevo Lote' }}</h2>
<br>
<mat-dialog-content>
<form [formGroup]="loteForm"
      class="formulario-container"
      (ngSubmit)="$event.preventDefault()"
      (keydown.enter)="$event.preventDefault()">

  <mat-form-field appearance="outline">
    <mat-label>Código de Barras</mat-label>
    <input matInput formControlName="codigoBarras" required
           (keydown.enter)="$event.stopPropagation(); $event.preventDefault();">
    <button mat-icon-button
            type="button"
            matSuffix
            (click)="abrirEscaner()"
            aria-label="Escanear código">
      <mat-icon>document_scanner</mat-icon>
    </button>
  </mat-form-field>

  <!-- Precio de Compra -->
  <mat-form-field appearance="outline">
    <mat-label>Precio de Compra</mat-label>
    <input matInput type="number" formControlName="precioCompra" required>
  </mat-form-field>

  <!-- Precio de Venta -->
  <mat-form-field appearance="outline">
    <mat-label>Precio de Venta</mat-label>
    <input matInput type="number" formControlName="precioVenta" required>
  </mat-form-field>

  <!-- Cantidad -->
  <mat-form-field appearance="outline">
    <mat-label>Cantidad</mat-label>
    <input matInput type="number" formControlName="cantidad" required>
  </mat-form-field>
</form>

<mat-dialog-actions align="end" class="acciones-dialogo">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>

  <button mat-raised-button color="primary"
          type="button"
          [disabled]="loteForm.invalid"
          (click)="data.lote ? actualizarLote() : guardarLote()">
    {{ data.lote ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>

</mat-dialog-content>
