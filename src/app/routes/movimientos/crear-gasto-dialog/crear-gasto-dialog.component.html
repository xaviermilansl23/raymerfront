<h2 mat-dialog-title>{{ modoEdicion ? 'Editar Gasto' : 'Agregar Gasto' }}</h2>
<br>
<div mat-dialog-content>
  <form [formGroup]="gastoForm" class="formulario-container">
    <mat-form-field appearance="outline">
      <mat-label>Nombre del Gasto</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Total</mat-label>
      <input matInput type="number" formControlName="total" />
    </mat-form-field>
  </form>
  <div mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardarGasto()" [disabled]="gastoForm.invalid">
    {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
  </button>
</div>

</div>
