<h2 mat-dialog-title>Actualizar Configuración del Sistema</h2>
<br>

<mat-dialog-content>
  <form [formGroup]="form" class="formulario-container">

    <!-- Fecha Último Pago -->
    <mat-form-field appearance="outline">
      <mat-label>Fecha Último Pago</mat-label>
      <input matInput [matDatepicker]="picker1" formControlName="fecha_ultimo_pago" [min]="minDate" required>
      <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>

    <!-- Fecha de Vencimiento -->
    <mat-form-field appearance="outline">
      <mat-label>Fecha de Vencimiento</mat-label>
      <input matInput [matDatepicker]="picker2" formControlName="fecha_vencimiento" [min]="minDate" required>
      <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>

    <!-- Observaciones -->
    <mat-form-field appearance="outline">
      <mat-label>Observaciones</mat-label>
      <textarea matInput formControlName="observaciones" rows="3" required></textarea>
    </mat-form-field>

  </form>

  <mat-dialog-actions align="end" class="acciones-dialogo">
    <button mat-button (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="actualizar()">
      Actualizar
    </button>
  </mat-dialog-actions>
</mat-dialog-content>
